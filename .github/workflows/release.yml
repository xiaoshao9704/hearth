# 发布流水线：打 tag（v*）或手动触发
# - build 作业：前端构建一次（拷入 embed 目录）+ Go 原生交叉编译六个目标的静态二进制；
#   tag 触发时 tar.gz/zip 作为 GitHub Release 资产发布，同时把产物传给 image 作业
# - image 作业：用 Dockerfile.release 纯 COPY 装配多架构 OCI 镜像推 ghcr.io——
#   没有任何 RUN 指令，不需要 QEMU，秒级完成（此前 arm64 在 QEMU 下编译要 1 小时+）。
#   自包含 -livekit/-full 镜像档（Dockerfile.aio + aioinit）已退役：内嵌 LiveKit 并入了主镜像
#   （进程内 lkembed，见 docs/plan-livekit-embed.md）；两个过渡别名 tag 只保留了一个版本，已删。
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # 创建 Release
  packages: write # 推送 ghcr.io

env:
  VERSION: ${{ github.ref_type == 'tag' && github.ref_name || format('sha-{0}', github.sha) }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: 构建前端（同源部署，API 走相对路径；产物与架构无关，只建一次）
        working-directory: web
        env:
          VITE_SERVER_URL: ""
          VITE_LIVEKIT_URL: ""
        run: |
          npm ci
          npm run build

      - name: 前端产物拷入 embed 目录（go:embed 不能引用模块外路径，构建前落位）
        run: |
          rm -rf server/internal/webui/dist
          mkdir -p server/internal/webui/dist
          cp -r web/dist/. server/internal/webui/dist/

      - uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: 原生交叉编译静态二进制（hearth 六目标；stage 远端形态只发 linux）
        working-directory: server
        env:
          CGO_ENABLED: 0
        run: |
          mkdir -p "$GITHUB_WORKSPACE/out"
          for target in linux/amd64 linux/arm64 windows/amd64 windows/arm64 darwin/amd64 darwin/arm64; do
            os="${target%/*}"; arch="${target#*/}"
            bin="hearth-$os-$arch"
            [ "$os" = windows ] && bin="$bin.exe"
            GOOS=$os GOARCH=$arch go build -ldflags "-s -w -X main.version=$VERSION" -o "$GITHUB_WORKSPACE/out/$bin" ./cmd/server
          done
          for arch in amd64 arm64; do
            # 远端舞台内核：单文件，跑在另一台机器上替代 livekit 容器
            GOOS=linux GOARCH=$arch go build -ldflags "-s -w" -o "$GITHUB_WORKSPACE/out/stage-linux-$arch" ./cmd/stage
          done

      - name: 打包 Release 产物（单文件：前端已嵌进二进制，不再随包发 web 目录）
        run: |
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os="${target%/*}"; arch="${target#*/}"
            pkg="hearth_${VERSION}_${os}_${arch}"
            mkdir -p "$pkg"
            cp "out/hearth-$os-$arch" "$pkg/hearth"
            tar -czf "$pkg.tar.gz" "$pkg"
          done
          for arch in amd64 arm64; do
            pkg="hearth_${VERSION}_windows_${arch}"
            mkdir -p "$pkg"
            cp "out/hearth-windows-$arch.exe" "$pkg/hearth.exe"
            zip -qr "$pkg.zip" "$pkg"
          done

      - name: 上传构建产物（喂给 image 作业；手动触发时也可下载）
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: |
            out/hearth-*
            out/stage-linux-*
            hearth_*.tar.gz
            hearth_*.zip
          retention-days: 14

      - name: 发布 Release 资产
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          files: |
            hearth_*.tar.gz
            hearth_*.zip
            out/stage-linux-*

  image:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v7
        with:
          name: dist

      - name: 准备装配上下文（distroless 无 shell，/data 目录在构建上下文里备好）
        run: mkdir -p out/data && touch out/data/.keep

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}
            type=raw,value=edge,enable=${{ github.ref_type != 'tag' }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.release
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # 远端舞台镜像（Dockerfile.stage）：单独的镜像名 <repo>-stage，纯装配
      - uses: docker/metadata-action@v6
        id: meta-stage
        with:
          images: ghcr.io/${{ github.repository }}-stage
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}
            type=raw,value=edge,enable=${{ github.ref_type != 'tag' }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.stage
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-stage.outputs.tags }}
          labels: ${{ steps.meta-stage.outputs.labels }}
