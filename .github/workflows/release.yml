# 发布流水线：打 tag（v*）或手动触发
# - build 作业：前端构建一次 + Go 原生交叉编译双架构静态二进制；
#   tag 触发时 tar.gz 作为 GitHub Release 资产发布，同时把产物传给 image 作业
# - image 作业：用 Dockerfile.release 纯 COPY 装配多架构 OCI 镜像推 ghcr.io——
#   没有任何 RUN 指令，不需要 QEMU，秒级完成（此前 arm64 在 QEMU 下编译要 1 小时+）。
#   自包含 -livekit/-full 镜像档（Dockerfile.aio + aioinit）已退役：内嵌 LiveKit 并入了主镜像
#   （进程内 lkembed，见 docs/plan-livekit-embed.md），只留这两个 tag 作为一个版本的过渡别名。
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # 创建 Release
  packages: write # 推送 ghcr.io

env:
  VERSION: ${{ github.ref_type == 'tag' && github.ref_name || format('sha-{0}', github.sha) }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: 构建前端（同源部署，API 走相对路径；产物与架构无关，只建一次）
        working-directory: web
        env:
          VITE_SERVER_URL: ""
          VITE_LIVEKIT_URL: ""
        run: |
          npm ci
          npm run build

      - uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: 原生交叉编译双架构静态二进制
        working-directory: server
        env:
          CGO_ENABLED: 0
          GOOS: linux
        run: |
          mkdir -p "$GITHUB_WORKSPACE/out"
          for arch in amd64 arm64; do
            GOARCH=$arch go build -ldflags "-s -w" -o "$GITHUB_WORKSPACE/out/hearth-linux-$arch" ./cmd/server
            # 远端舞台内核：单文件，跑在另一台机器上替代 livekit + bellows 两个容器
            GOARCH=$arch go build -ldflags "-s -w" -o "$GITHUB_WORKSPACE/out/stage-linux-$arch" ./cmd/stage
            # 远端 Bellows 推流网关：已被 cmd/stage 取代，下一版本移除
            GOARCH=$arch go build -ldflags "-s -w" -o "$GITHUB_WORKSPACE/out/bellows-linux-$arch" ./cmd/bellows
          done

      - name: 打包 Release 产物
        run: |
          for arch in amd64 arm64; do
            pkg="hearth_${VERSION}_linux_${arch}"
            mkdir -p "$pkg"
            cp "out/hearth-linux-$arch" "$pkg/hearth"
            cp -r web/dist "$pkg/web"
            tar -czf "$pkg.tar.gz" "$pkg"
          done

      - name: 上传构建产物（喂给 image 作业；手动触发时也可下载）
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: |
            out/hearth-linux-*
            out/stage-linux-*
            out/bellows-linux-*
            web/dist
            hearth_*.tar.gz
          retention-days: 14

      - name: 发布 Release 资产
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          files: |
            hearth_*.tar.gz
            out/stage-linux-*
            out/bellows-linux-*

  image:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v7
        with:
          name: dist

      - name: 准备装配上下文（distroless 无 shell，/data 目录在构建上下文里备好）
        run: mkdir -p out/data && touch out/data/.keep

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}
            type=raw,value=edge,enable=${{ github.ref_type != 'tag' }}

      # 过渡别名：旧自包含镜像档 -livekit/-full（Dockerfile.aio + aioinit）已退役，内嵌 LiveKit
      # 并入了主镜像（进程内 lkembed）。这两个 tag 只在这一个版本里指向与主镜像相同的内容，
      # 方便旧部署把 tag 名切过来；下一个版本发布时删掉这两段 metadata 步骤与下面的 tags 拼接
      # （比照 CLAUDE.md 里 pion_* 只保留一个版本的先例，不要长期维护）。
      - uses: docker/metadata-action@v6
        id: meta-livekit-alias
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: suffix=-livekit,onlatest=true
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}

      - uses: docker/metadata-action@v6
        id: meta-full-alias
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: suffix=-full,onlatest=true
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.release
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.meta.outputs.tags }}
            ${{ steps.meta-livekit-alias.outputs.tags }}
            ${{ steps.meta-full-alias.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # 远端舞台镜像（Dockerfile.stage）：单独的镜像名 <repo>-stage，纯装配
      - uses: docker/metadata-action@v6
        id: meta-stage
        with:
          images: ghcr.io/${{ github.repository }}-stage
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}
            type=raw,value=edge,enable=${{ github.ref_type != 'tag' }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.stage
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-stage.outputs.tags }}
          labels: ${{ steps.meta-stage.outputs.labels }}
