[package]
name = "hearth-desktop"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "Hearth 桌面端"
publish = false

[lib]
name = "hearth_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
gstreamer = "0.25"
gstreamer-app = "0.25"
gstreamer-video = "0.25"
gstreamer-audio = "0.25"
gstreamer-webrtc = "0.25"
# 应用内信任与 WHIP 回环反代：reqwest 选 native-tls（macOS 上就是 Security.framework，
# 与 WKWebView 的 SecTrust 同一套判定；加锚不会关掉系统根，见 pair/check 的注释）。
reqwest = { version = "0.13", default-features = false, features = ["native-tls"] }
sha2 = "0.10"
base64 = "0.22"
getrandom = "0.3"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
tokio = { version = "1", features = ["net", "rt", "time"] }
# 外链交给系统默认浏览器：WebView 里 target=_blank / window.open 什么都不发生，
# 直接导航又会把本地页面顶掉，回不来。
tauri-plugin-opener = "2"
# hearth:// 深链：浏览器跳转登录在浏览器里批准后，由系统把一次性码送回本应用。
tauri-plugin-deep-link = "2"

# macOS 采集：直接用 objc2 的框架绑定（ScreenCaptureKit + CoreMedia/CoreVideo），
# 不走第三方封装——SCStream 的音频样本与像素缓冲都要按原样拿到，封装层反而挡路。
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-core-foundation = "0.3"
objc2-core-audio-types = "0.3"
objc2-screen-capture-kit = { version = "0.3", features = [
    "SCStream",
    "SCShareableContent",
    "SCError",
    "block2",
    "dispatch2",
    "objc2-core-media",
    "objc2-core-foundation",
    "objc2-core-graphics",
] }
objc2-core-media = { version = "0.3", features = [
    "CMBase",
    "CMBlockBuffer",
    "CMFormatDescription",
    "CMSampleBuffer",
    "CMSync",
    "objc2-core-audio-types",
] }
objc2-core-video = { version = "0.3", features = [
    "CVBase",
    "CVBuffer",
    "CVImageBuffer",
    "CVPixelBuffer",
    "CVReturn",
] }
objc2-core-graphics = { version = "0.3", features = ["CGDirectDisplay"] }
block2 = "0.6"
dispatch2 = "0.3"
objc2-security = { version = "0.3", default-features = false, features = [
    "std",
    "objc2",
    "SecBase",
    "SecTrust",
    "SecCertificate",
] }


[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_Security", "Win32_System_SystemInformation", "Wdk_System_SystemServices"] }
# 应用内信任在 Windows 侧要自己挂 WebView2 的证书错误事件（wry/Tauri 不暴露）：
# 版本跟着 Tauri/wry 锁定的那套走，不另起一套，否则 COM 接口类型对不上。
webview2-com = "0.38"
windows = "0.61"
# 证书错误事件只给 PEM，链校验在 Rust 侧纯软件做（不碰系统信任库，也不联网）。
rustls-webpki = { version = "0.103", default-features = false, features = ["std", "ring"] }
rustls-pki-types = "1"
