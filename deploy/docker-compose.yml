# Hearth 最小部署形态：一个服务、三条端口、一个命名卷。
# 与根目录 README「三分钟跑起来」里的那份保持一致，改这里记得同步改 README。
#
#   docker compose -f deploy/docker-compose.yml up -d
#   docker compose -f deploy/docker-compose.yml exec hearth /app/hearth adduser alice change-me
#
# 首个账号自动成为 super（全站最高权限）。之后打开 http://<主机>:8080 即可用。
# 局域网里的其它设备要先打开 https://<主机>:8080/ca 装一次根证书，
# 装完用 https 打开才有麦克风、投屏、通知权限（浏览器只在安全上下文里放行）。

services:
  hearth:
    image: ghcr.io/xiaoshao9704/hearth:latest
    restart: unless-stopped
    ports:
      # Web / API / 信令 / WHIP 共用的唯一 HTTP 端口，同端口默认也收 https（合并模式）
      - "8080:8080"
      # 媒体端口：语音与投屏共用，必须在防火墙 / 安全组放行。
      # docker 的端口发布不能事后热加，创建容器时就要一并写上。
      - "47720:47720/udp"
      # ICE-TCP 兜底：只在 UDP 被中间设备接管的网络才用得上，默认与 UDP 同号开启
      - "47720:47720/tcp"
    volumes:
      # 唯一持久化边界：数据库、自动生成的密钥、自签 TLS 根证书都在里面。
      # 用命名卷而不是 bind-mount：容器以 uid 65532（distroless nonroot）运行，
      # 挂宿主目录要先 chown 65532:65532，命名卷没有这个坑。
      - hearth-data:/data

volumes:
  hearth-data:
