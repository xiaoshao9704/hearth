<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f3ee" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0d0b0a" media="(prefers-color-scheme: dark)" />
    <title>Hearth</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 18 20'%3E%3Cpath d='M9 1.5c3.2 3.1 4.6 5.4 4.6 7.7 0 1.5-.7 2.7-1.8 3.4.5-1.6.2-3.1-1-4.6.1 2.5-1.1 3.9-2.4 5.1-1.1 1-1.7 2-1.7 3.2 0 .9.3 1.7.9 2.3C4.4 17.7 2.6 15.4 2.6 12.4 2.6 8.2 6.1 5.8 9 1.5z' fill='%23e8703a'/%3E%3Cpath d='M9 18.5c1.9 0 3.2-1.2 3.2-2.9 0-1.4-.9-2.3-2-3.3-.4 1.3-1.3 2-2.4 2.5-.9.4-1.4 1-1.4 1.9 0 1.1.9 1.8 2.6 1.8z' fill='%23f0b98f'/%3E%3C/svg%3E" />
    <script>
      // 主题需在 CSS 渲染前落到 html 上，避免闪白/闪黑
      try {
        var t = localStorage.getItem('hearth_theme');
        document.documentElement.dataset.theme = t === 'light' || t === 'dark' ? t : 'auto';
      } catch (e) {
        document.documentElement.dataset.theme = 'auto';
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- 非阻塞加载：先按 print 媒介取，onload 时换回 all，不挡首屏渲染（内网部署字体拉不到也不会白屏） -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;700&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;700&display=swap"
      />
    </noscript>
  </head>
  <body>
    <noscript>需要启用 JavaScript</noscript>
    <div id="app">
      <!-- 首个视图挂载前的静态骨架，内联最小样式，不依赖 style.css 到位 -->
      <div style="height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:#8a8078">
        <svg width="22" height="24" viewBox="0 0 18 20" fill="none" aria-hidden="true">
          <path d="M9 1.5c3.2 3.1 4.6 5.4 4.6 7.7 0 1.5-.7 2.7-1.8 3.4.5-1.6.2-3.1-1-4.6.1 2.5-1.1 3.9-2.4 5.1-1.1 1-1.7 2-1.7 3.2 0 .9.3 1.7.9 2.3C4.4 17.7 2.6 15.4 2.6 12.4 2.6 8.2 6.1 5.8 9 1.5z" fill="currentColor" />
        </svg>
        <span style="font-size:13px">正在启动…</span>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
